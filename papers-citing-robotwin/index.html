<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoboTwin Connect</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <!-- 顶部标题 -->
    <header class="page-head" role="banner">
      <h1 class="page-title">Papers Citing RoboTwin</h1>
    </header>

    <main id="main" tabindex="-1">
      <!-- 论文简介 -->
      <section class="paper-hero paper-hero--stack" aria-labelledby="paper-title">
        <div class="thumb">
          <img src="img/title_img/robotwin-text-logo.jpg" alt="robotwin-text-logo" />
        </div>
        <h2 id="paper-title" class="paper-title">
          RoboTwin 2.0: A Scalable Data Generator and Benchmark with<br>
          Strong Domain Randomization for Robust Bimanual Robotic Manipulation
        </h2>

        <nav class="linkbar" aria-label="links">
          <a class="chip" href="https://robotwin-platform.github.io/" target="_blank" rel="noopener">🔗 Webpage</a>
          <a class="chip" href="https://arxiv.org/abs/2506.18088" target="_blank" rel="noopener">📄 arXiv</a>
          <a class="chip" href="https://arxiv.org/pdf/2506.18088" target="_blank" rel="noopener">📄 PDF</a>
          <a class="chip" href="https://github.com/robotwin-Platform/RoboTwin" target="_blank" rel="noopener">💻 Code</a>
          <a class="chip" href="https://robotwin-platform.github.io/doc/" target="_blank" rel="noopener">📓 Document</a>
        </nav>
      </section>

      <hr class="divider" />

      <!-- 引用论文（加载 card.html） -->
      <section aria-label="Citing Papers">
        <div id="panel20" class="cite-grid"></div>
      </section>
    </main>

    <footer class="footer" role="contentinfo">
      Last updated: <span id="last-updated">--</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
